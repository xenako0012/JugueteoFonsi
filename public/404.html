<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Página no encontrada — php2bash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #211b14;
        --muted: #7a6f5f;
        --primary: #5b4ee0;
        --voltage: #ffd84d;
        --paper: #fffdf8;
        --bg: #f6f2ea;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      .card {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 20px;
        padding: 44px 36px;
        max-width: 620px;
        text-align: center;
        box-shadow: 6px 6px 0 rgba(33, 27, 20, 0.16);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 1px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1.5px solid var(--ink);
        background: var(--voltage);
        color: var(--ink);
        margin-bottom: 22px;
      }
      .big {
        font-size: clamp(88px, 20vw, 150px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -2px;
      }
      .grad {
        background: linear-gradient(120deg, var(--primary), var(--voltage));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        font-size: clamp(20px, 4vw, 26px);
        margin: 18px 0 12px;
      }
      p {
        color: var(--muted);
        line-height: 1.7;
        margin: 0 auto 10px;
        max-width: 46ch;
      }
      .hand {
        font-family: "Caveat", cursive;
        font-size: 21px;
        color: var(--primary);
      }
      .cat {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--muted);
        margin: 20px 0 26px;
      }
      a.btn {
        display: inline-block;
        font-weight: 700;
        text-decoration: none;
        padding: 13px 26px;
        border-radius: 12px;
        border: 1.5px solid var(--ink);
        background: var(--primary);
        color: var(--paper);
        box-shadow: 3px 3px 0 rgba(33, 27, 20, 0.22);
      }
      a.btn:hover {
        transform: translateY(-2px);
      }
      a.ghost {
        margin-left: 12px;
        background: transparent;
        color: var(--ink);
      }
      @media (max-width: 520px) {
        a.ghost {
          margin: 12px 0 0;
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="chip"><span aria-hidden="true">☠</span> ERROR // RUTA_NO_ENCONTRADA</span>
      <div class="big">4<span class="grad">0</span>4</div>
      <h1>Esta ruta no está en la cronología</h1>
      <p>Kuro ha mirado dentro de la caja y no había nada… solo huellas.</p>
      <p class="hand">…aquí no hay nada que parchear.</p>
      <p class="cat">=^..^=</p>
      <a class="btn" href="/JugueteoFonsi/">Volver al resumen</a>
      <a class="btn ghost" href="/JugueteoFonsi/conclusiones">Ver conclusiones</a>
    </main>
  </body>
</html>
